  - {name: OpenAI, ats: ashby, slug: openai, group: ai-bio, verified: false}
  - {name: Recursion, ats: greenhouse, slug: recursionpharmaceuticals, group: ai-bio, verified: false}
  - {name: insitro, ats: greenhouse, slug: insitro, group: ai-bio, verified: false}
  - {name: "Generate:Biomedicines", ats: greenhouse, slug: generatebiomedicines, group: ai-bio, verified: false}
  - {name: Basecamp Research, ats: ashby, slug: basecampresearch, group: ai-bio, country: GB, verified: false}
  - {name: LabGenius, ats: workable, slug: labgenius, group: ai-bio, country: GB, verified: false}

