# PetriPath — company job boards (AI × biology wet labs, biotech, pharma)
#
# Read through each board's public API (sources_ats.py). Every role a company lists is
# fetched; only biology research roles are kept, each tagged wet / hybrid / computational.
#
# ats       greenhouse | lever | ashby | workable | workday
# slug      the board name in the API URL   (workday: host, tenant, site, queries)
# group     ai-bio (AI-first, runs or funds its own wet lab) | biotech | pharma | nonprofit | institute
# country   ISO-2 fallback when a role names no location
# verified  true = the board was seen live in Nov 2026. false = the company's usual board name,
#           not yet confirmed: `python scraper/doctor.py --probe <slug>` finds the right one.

companies:

# ── AI labs and AI-first biology companies running wet labs ─────────────────
  - {name: Anthropic, ats: greenhouse, slug: anthropic, group: ai-bio, verified: true,
     note: "Bay Area wet lab confirmed Sept 2026; hires Research Scientists (Experimental Biology) and Research Associates"}
  - {name: Isomorphic Labs, ats: greenhouse, slug: isomorphiclabs, group: ai-bio, verified: true,
     note: "London, Lausanne, Cambridge MA; in vitro pharmacology, biologics and translational biology roles"}
  - {name: Xaira Therapeutics, ats: greenhouse, slug: xairatherapeutics, group: ai-bio, verified: true,
     note: "Bay Area, Seattle, London"}
  - {name: Biohub (Chan Zuckerberg), ats: greenhouse, slug: biohub, group: ai-bio, verified: true}
  - {name: Lila Sciences, ats: greenhouse, slug: lilasciences, group: ai-bio, verified: true,
     note: "autonomous science platform with a Life Science Research team"}
  - {name: Profluent, ats: greenhouse, slug: profluent, group: ai-bio, verified: true}
  - {name: Adaptyv Bio, ats: ashby, slug: adaptyv, group: ai-bio, country: CH, verified: true,
     note: "automated protein lab in Lausanne and London — wet-lab scientist roles in Europe"}
  - {name: Tabula Bio, ats: ashby, slug: tabulabio, group: ai-bio, verified: true,
     note: "AI-first phage therapeutics for hard-to-treat infections; hands-on bench roles"}
  - {name: Latent Labs, ats: ashby, slug: latentlabs, group: ai-bio, country: GB, verified: true}
  - {name: Axiom Bio, ats: ashby, slug: axiombio, group: ai-bio, verified: true}
  - {name: Anthrogen, ats: ashby, slug: anthrogen, group: ai-bio, verified: true}
  - {name: GT Biosciences, ats: ashby, slug: gt-bio, group: ai-bio, verified: true}
  - {name: Google DeepMind, ats: greenhouse, slug: deepmind, group: ai-bio, verified: false,
